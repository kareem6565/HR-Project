name: Security and quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (changed commits)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan changed commits with redacted output
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
            log_opts="${base_sha}..${GITHUB_SHA}"
          else
            before_sha="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
            if [[ -n "$before_sha" && "$before_sha" != "0000000000000000000000000000000000000000" ]]; then
              log_opts="${before_sha}..${GITHUB_SHA}"
            else
              log_opts="-1"
            fi
          fi
          docker run --rm -v "$PWD:/path" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --log-opts="$log_opts" /path

  backend:
    name: Backend audit, lint, and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hr_ai_assistant
          POSTGRES_USER: hr_ai_assistant
          POSTGRES_PASSWORD: hr_ai_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr_ai_assistant -d hr_ai_assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://hr_ai_assistant:hr_ai_assistant@localhost:5432/hr_ai_assistant
      TEST_DATABASE_URL: postgresql+psycopg://hr_ai_assistant:hr_ai_assistant@localhost:5432/hr_ai_assistant_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: HR create jop/backend/pyproject.toml
      - name: Install local OCR tools for scanned-PDF tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara tesseract-ocr-osd poppler-utils
      - name: Install backend and audit tool
        working-directory: HR create jop/backend
        run: python -m pip install -e ".[dev]" pip-audit
      - name: Install optional A5 runtime for its test collection and parity checks
        working-directory: HR create jop/backend
        run: python -m pip install --require-hashes -r requirements-a5.lock
      - name: Upgrade setuptools used by the dependency audit
        run: python -m pip install --upgrade "setuptools>=84.1.0"
      - name: Audit Python dependencies
        working-directory: HR create jop/backend
        run: pip-audit
      - name: Ruff
        working-directory: HR create jop/backend
        run: ruff check .
      - name: Pytest
        working-directory: HR create jop/backend
        run: pytest -m "not soal" -q --tb=short

  frontend:
    name: Frontend audit, lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HR create jop/frontend/frontend_last
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: HR create jop/frontend/frontend_last/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Oxlint
        run: npm run lint
      - name: Vitest
        run: npm test -- --reporter=dot
      - name: Build
        run: npm run build
