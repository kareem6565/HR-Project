[project]
name = "hr-ai-assistant-backend"
version = "0.1.0"
description = "Backend foundation for the AI HR Recruitment Assistant."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.115.0",
    "openai>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.8.0",
    "pypdf>=6.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
hera-admin = "app.cli.bootstrap:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "soal: tests that require a live SOAL_API_KEY (skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
